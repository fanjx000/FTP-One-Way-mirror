name: tests

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit and UI tests
    runs-on: windows-latest
    env:
      # Qt cannot open a real window on a runner; the offscreen plugin lets the
      # widget tests run unchanged.
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Server / sync behaviour (no Qt)
        shell: bash
        run: |
          fail=0
          for t in test_sync test_505 test_quirky_server test_variants \
                   test_mkdir_modes test_diagnose; do
            echo "::group::$t"
            python -u tools/$t.py || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: User interface (offscreen Qt)
        shell: bash
        run: |
          fail=0
          for t in test_about test_crash_safety test_ui_response test_i18n ui_audit; do
            echo "::group::$t"
            python -u tools/$t.py || fail=1
            echo "::endgroup::"
          done
          exit $fail

  build:
    name: Build FtpSync.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build single-file exe
        run: python -m PyInstaller --noconfirm FtpSync-onefile.spec

      - name: Smoke test the exe
        run: |
          python -u tools/test_exe.py dist\FtpSync.exe
          python -u tools/test_exe_quirky.py dist\FtpSync.exe

      - uses: actions/upload-artifact@v4
        with:
          name: FtpSync-windows-x64
          path: dist/FtpSync.exe
          if-no-files-found: error

