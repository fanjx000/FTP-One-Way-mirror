name: tests

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit and UI tests
    runs-on: windows-latest
    env:
      # a runner has no interactive desktop; the offscreen plugin lets the
      # widget tests run exactly as they do on a normal machine
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # one runner prints a table, keeps going after a failing suite, and writes
      # the failing output into the run summary so no log download is needed
      - name: Run all suites
        run: python -u tools/run_tests.py

  build:
    name: Build FtpSync.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build single-file exe
        run: python -m PyInstaller --noconfirm FtpSync-onefile.spec

      - name: Smoke test the exe
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          python -u tools/test_exe.py dist\FtpSync.exe
          python -u tools/test_exe_quirky.py dist\FtpSync.exe

      - uses: actions/upload-artifact@v4
        with:
          name: FtpSync-windows-x64
          path: dist/FtpSync.exe
          if-no-files-found: error
